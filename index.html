<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Margin Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: four columns on desktop (shelf · list · writing desk · margin panel), one pane at a time on phones. Paper-and-ink palette: cool graphite paper, iron-gall blue ink, highlighter yellow. */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunken:#ECEEEA; --raised:#FFFFFF;
  --line:#DCE0DA; --line-strong:#C6CCC4;
  --fg:#1A1E1C; --fg-2:#3A403D; --muted:#69736E; --faint:#9AA39E;
  --accent:#2747C8; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB; --accent-line:#B9C5F3;
  --mark:#F6E46A; --mark-soft:#FBF3BE;
  --danger:#B93A27; --danger-soft:#F8E3DE; --ok:#2F7A4B; --warn:#A86A00; --warn-soft:#FAEDD3;
  --paper-rule:#E3E7EF; --paper-dot:#C9CFC8;
  --shadow:0 1px 2px rgba(20,28,24,.06),0 8px 24px rgba(20,28,24,.08);
  --shadow-lg:0 2px 6px rgba(20,28,24,.08),0 24px 60px rgba(20,28,24,.18);
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --f-note:var(--f-read);
  --r:8px; --r-sm:5px;
  --side-w:232px; --list-w:300px; --insp-w:300px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#181C1A; --sunken:#0D100F; --raised:#1F2421;
  --line:#2A302D; --line-strong:#3A423E;
  --fg:#E5E9E6; --fg-2:#C3CAC6; --muted:#8E9993; --faint:#626C67;
  --accent:#93A8FF; --accent-ink:#0E1430; --accent-soft:#1E2747; --accent-line:#34437D;
  --mark:#C9B33A; --mark-soft:#3A3519;
  --danger:#F08A76; --danger-soft:#3A1F1A; --ok:#7BC897; --warn:#E7B45A; --warn-soft:#352A15;
  --paper-rule:#252B33; --paper-dot:#323935;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#181C1A; --sunken:#0D100F; --raised:#1F2421;
  --line:#2A302D; --line-strong:#3A423E;
  --fg:#E5E9E6; --fg-2:#C3CAC6; --muted:#8E9993; --faint:#626C67;
  --accent:#93A8FF; --accent-ink:#0E1430; --accent-soft:#1E2747; --accent-line:#34437D;
  --mark:#C9B33A; --mark-soft:#3A3519;
  --danger:#F08A76; --danger-soft:#3A1F1A; --ok:#7BC897; --warn:#E7B45A; --warn-soft:#352A15;
  --paper-rule:#252B33; --paper-dot:#323935;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.4),0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark}
:root.sans-notes{--f-note:var(--f-ui)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:15px;height:15px}
.mono{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- shell ---------- */
.app{display:flex;flex:1;min-height:0}
.side{width:var(--side-w);flex:none;display:flex;flex-direction:column;background:var(--sunken);border-right:1px solid var(--line);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand-mark{width:22px;height:22px;border-radius:5px;background:var(--accent);position:relative;flex:none}
.brand-mark::after{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--accent-ink);border-radius:2px;box-shadow:5px 0 0 var(--mark)}
.brand b{font-size:15px;letter-spacing:-.01em}
.side-scroll{flex:1;overflow:auto;padding:4px 8px 12px;min-height:0}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:6px;color:var(--fg-2);text-align:left;min-width:0}
.nav-btn:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.nav-btn.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.nav-btn .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-btn .cnt{font:12px var(--f-mono);color:var(--faint);font-variant-numeric:tabular-nums}
.nav-btn kbd{font:11px var(--f-mono);color:var(--faint)}
.side-sec{display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px}
.side-sec button{color:var(--muted);border-radius:4px;padding:2px}
.side-sec button:hover{color:var(--fg);background:color-mix(in srgb,var(--fg) 8%,transparent)}
.nb-dot{width:9px;height:9px;border-radius:3px;flex:none}
.nb-child{padding-left:28px}
.tag-cloud{display:flex;flex-wrap:wrap;gap:4px;padding:2px 6px}
.tag-cloud button{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--fg-2)}
.tag-cloud button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.side-foot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--line)}
.side-foot .nav-btn{flex:1}
.capture-btn{display:flex;align-items:center;gap:10px;margin:2px 0 8px;width:100%;padding:9px 10px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.capture-btn kbd{margin-left:auto;font:11px var(--f-mono);opacity:.75}

.listpane{width:var(--list-w);flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--bg);min-height:0}
.list-head{padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.list-head-row{display:flex;align-items:center;gap:8px}
.list-head h2{font-size:17px;margin:0;flex:1;min-width:0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-filter{display:flex;gap:6px;align-items:center}
.list-filter input{flex:1;min-width:0;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 10px}
.list-filter select{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 6px;font-size:12px}
.list{flex:1;overflow:auto;padding:6px;min-height:0}
.row{display:block;width:100%;text-align:left;padding:9px 10px 10px;border-radius:7px;position:relative;min-width:0}
.row+.row{margin-top:1px}
.row:hover{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.row.on{background:var(--surface);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04)}
.row.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.row-top{display:flex;align-items:center;gap:7px;min-width:0}
.row-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-snip{color:var(--muted);font-size:13px;margin-top:2px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row-meta{display:flex;gap:8px;align-items:center;margin-top:5px;color:var(--faint);font-size:12px;min-width:0;flex-wrap:wrap}
.row-meta .chip{font-size:11px}
.type-ico{color:var(--muted)}
.empty{padding:28px 18px;color:var(--muted);text-align:center;font-size:13px;line-height:1.6}
.empty b{display:block;color:var(--fg-2);font-size:14px;margin-bottom:4px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg);min-height:38px;flex:none;min-width:0}
.tabs-strip{display:flex;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs-strip::-webkit-scrollbar,.ed-bar::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;padding:0 8px 0 12px;max-width:210px;min-width:110px;border-right:1px solid var(--line);color:var(--muted);font-size:13px;position:relative;flex:none}
.tab .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tab .x{opacity:0;border-radius:4px;padding:2px;display:grid;place-items:center}
.tab:hover .x,.tab.on .x{opacity:.7}
.tab .x:hover{opacity:1;background:color-mix(in srgb,var(--fg) 10%,transparent)}
.tab.on{background:var(--surface);color:var(--fg)}
.tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--surface)}
.tab .n{font:10px var(--f-mono);color:var(--faint)}
.tabs-tools{display:flex;align-items:center;gap:2px;padding:0 8px;flex:none;border-left:1px solid var(--line)}
.tabs-strip:empty+.tabs-tools{border-left:0;margin-left:auto}
.view{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}

.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:6px;color:var(--fg-2);flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--fg) 7%,transparent);color:var(--fg)}
.icon-btn.on{background:var(--accent-soft);color:var(--accent)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:color-mix(in srgb,var(--fg) 6%,transparent)}
.btn.danger{color:var(--danger)}
.btn.sm{height:27px;padding:0 9px;font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;background:var(--sunken);border:1px solid var(--line);font-size:12px;color:var(--fg-2);white-space:nowrap;max-width:100%}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.accent{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip button{display:grid;place-items:center;color:var(--muted)}

/* ---------- inspector ---------- */
.insp{width:var(--insp-w);flex:none;border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.insp-tabs{display:flex;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);align-items:center}
.insp-tabs button{padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:500;font-size:13px}
.insp-tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.insp-body{flex:1;overflow:auto;padding:14px;min-height:0;display:flex;flex-direction:column;gap:18px}
.insp h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.link-card{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:7px;background:var(--surface);border:1px solid var(--line);min-width:0}
.link-card+.link-card{margin-top:6px}
.link-card:hover{border-color:var(--accent-line)}
.link-card b{display:flex;gap:6px;align-items:center;font-size:13px}
.link-card p{margin:4px 0 0;font-size:12.5px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.link-card mark{background:var(--mark-soft);color:inherit;border-radius:2px}
.ver{display:flex;gap:10px;padding:8px 10px;border-radius:7px;align-items:flex-start;width:100%;text-align:left}
.ver:hover,.ver.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.ver-dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--accent);margin-top:5px;flex:none}
.ver small{display:block;color:var(--muted);font-size:12px}
.outline a{display:block;padding:3px 0;color:var(--fg-2);text-decoration:none;font-size:13px;cursor:pointer}
.outline a.h2{padding-left:12px}.outline a.h3{padding-left:24px;color:var(--muted)}
.outline a:hover{color:var(--accent)}
.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.export-grid .btn{justify-content:flex-start}

/* ---------- editor chrome ---------- */
.ed{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.ed-bar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);min-height:46px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:none;background:var(--surface)}
.ed-bar>*{flex-shrink:0}
.ed-bar .sep{width:1px;height:20px;background:var(--line);margin:0 6px}
.ed-bar .grow{flex:1}
.ed-scroll{flex:1;overflow:auto;min-height:0;position:relative;overscroll-behavior:contain}
.sheet{max-width:780px;margin:0 auto;padding:40px 40px 160px;position:relative}
.sheet-wrap{margin:0 auto;position:relative}
.sheet-wrap>.sheet{transform-origin:0 0;margin:0}
.title-in{width:100%;border:0;background:none;font:600 32px/1.2 var(--f-ui);letter-spacing:-.02em;padding:0;outline:none;color:var(--fg)}
.title-in::placeholder{color:var(--faint)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 22px;font-size:12.5px;color:var(--muted)}
.meta-row .chip{cursor:pointer}
.meta-row .chip:hover{border-color:var(--line-strong)}
.tag-add{border:1px dashed var(--line-strong);background:none;border-radius:20px;padding:2px 9px;font-size:12px;color:var(--muted);min-width:0;width:90px;outline:none}
.tag-add:focus{border-style:solid;border-color:var(--accent);color:var(--fg);width:140px}

/* rich text */
.rt{outline:none;font:400 18px/1.62 var(--f-note);color:var(--fg);min-height:240px;caret-color:var(--accent);position:relative;z-index:1}
.rt:empty::before{content:attr(data-ph);color:var(--faint)}
.rt p{margin:0 0 .55em}
.rt h1{font:600 1.55em/1.25 var(--f-ui);letter-spacing:-.015em;margin:1.1em 0 .4em}
.rt h2{font:600 1.25em/1.3 var(--f-ui);margin:1em 0 .35em}
.rt h3{font:600 1.05em/1.35 var(--f-ui);margin:.9em 0 .3em;color:var(--fg-2)}
.rt>:first-child{margin-top:0}
.rt ul,.rt ol{margin:0 0 .6em;padding-left:1.4em}
.rt li{margin:.12em 0}
.rt ul.todo{list-style:none;padding-left:.1em}
.rt ul.todo li{position:relative;padding-left:1.7em}
.rt ul.todo li::before{content:"";position:absolute;left:0;top:.32em;width:1em;height:1em;border:1.6px solid var(--line-strong);border-radius:4px;background:var(--surface);cursor:pointer}
.rt ul.todo li[data-done]::before{background:var(--accent);border-color:var(--accent)}
.rt ul.todo li[data-done]::after{content:"";position:absolute;left:.33em;top:.48em;width:.3em;height:.55em;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.rt ul.todo li[data-done]{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.rt blockquote{margin:.4em 0 .8em;padding:.1em 0 .1em 1em;border-left:3px solid var(--mark);color:var(--fg-2);font-style:italic}
.rt pre{font:13.5px/1.55 var(--f-mono);background:var(--sunken);padding:12px 14px;border-radius:7px;overflow-x:auto;white-space:pre-wrap}
.rt code{font:.84em var(--f-mono);background:var(--sunken);padding:1px 5px;border-radius:4px}
.rt hr{border:0;border-top:1px solid var(--line-strong);margin:1.4em 0}
.rt a{color:var(--accent)}
.rt mark{background:var(--mark-soft);color:inherit;border-radius:2px;padding:0 1px}
.rt img{display:block;max-width:100%;border-radius:6px;margin:.6em 0;border:1px solid var(--line)}
a.wl{color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:0 5px;border-radius:4px;cursor:pointer;font-family:var(--f-ui);font-size:.88em;font-weight:500;white-space:nowrap}
a.wl::before{content:"↗ ";opacity:.6;font-size:.85em}
a.wl.missing{background:var(--danger-soft);color:var(--danger)}
.blk{margin:.8em 0;border:1px solid var(--line);border-radius:9px;background:var(--surface);position:relative;user-select:none;-webkit-user-select:none}
.blk-head{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 10px;font:12px var(--f-ui);color:var(--muted);border-bottom:1px solid var(--line)}
.blk-head .grow{flex:1}
.blk-head button{border-radius:4px;padding:3px;display:grid;place-items:center;color:var(--muted)}
.blk-head button:hover{background:var(--sunken);color:var(--fg)}
.ink-blk canvas{display:block;width:100%;touch-action:pan-y;background-image:radial-gradient(var(--paper-dot) 1px,transparent 1.2px);background-size:22px 22px;border-radius:0 0 9px 9px}
.ink-blk .resize{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:40px;height:10px;border-radius:6px;background:var(--line-strong);cursor:ns-resize;touch-action:none}
.audio-blk{display:flex;align-items:center;gap:10px;padding:10px 12px}
.audio-blk audio{flex:1;min-width:0;height:36px}
.audio-blk .aname{font:500 13px var(--f-ui);color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}

/* paper styles for page notes */
.sheet.paper-ruled .rt{background-image:linear-gradient(transparent calc(1.62em - 1px),var(--paper-rule) calc(1.62em - 1px));background-size:100% 1.62em}
.sheet.paper-grid .ed-paper,.sheet.paper-dots .ed-paper{position:absolute;inset:0;pointer-events:none}
.sheet.paper-grid .ed-paper{background-image:linear-gradient(var(--paper-rule) 1px,transparent 1px),linear-gradient(90deg,var(--paper-rule) 1px,transparent 1px);background-size:24px 24px}
.sheet.paper-dots .ed-paper{background-image:radial-gradient(var(--paper-dot) 1.1px,transparent 1.3px);background-size:24px 24px}
.ink-over{position:sticky;top:0;left:0;display:block;width:100%;height:100%;pointer-events:none;z-index:3;margin-bottom:calc(-1 * var(--vh,600px))}

/* ink toolbar */
.inkbar{display:flex;align-items:center;gap:2px;padding:3px;border-radius:9px;background:var(--sunken)}
.inkbar .icon-btn{width:30px;height:30px}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);margin:0 2px;flex:none}
.swatch.on{box-shadow:0 0 0 2px var(--accent)}
.width-dot{display:grid;place-items:center;width:26px;height:30px;border-radius:6px}
.width-dot i{display:block;border-radius:50%;background:var(--fg-2)}
.width-dot.on{background:var(--surface);box-shadow:0 0 0 1px var(--line)}

/* slash/wikilink popup + menus */
.pop{position:fixed;z-index:60;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);padding:5px;min-width:220px;max-width:min(340px,calc(100vw - 24px));max-height:320px;overflow:auto}
.pop-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:6px;text-align:left;font-size:13.5px;min-width:0}
.pop-item .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-item small{color:var(--faint);font:11px var(--f-mono)}
.pop-item.on,.pop-item:hover{background:var(--accent-soft);color:var(--fg)}
.pop-item.danger{color:var(--danger)}

}

/* ---------- time formatting ---------- */
function relTime(ts) {
  if (!ts) return '';
  const d = Date.now() - ts;
  if (d < 45e3) return 'just now';
  if (d < 3600e3) return Math.round(d / 60e3) + ' min ago';
  const a = new Date(ts), n = new Date();
  if (a.toDateString() === n.toDateString()) return a.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const y = new Date(n - DAY);
  if (a.toDateString() === y.toDateString()) return 'Yesterday';
  if (d < 6 * DAY) return a.toLocaleDateString([], { weekday: 'long' });
  return a.toLocaleDateString([], { month: 'short', day: 'numeric', year: a.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
}
const fullTime = ts => new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
function untilText(ts) {
  const d = ts - Date.now();
  if (d <= 0) return 'expired';
  if (d < 3600e3) return Math.max(1, Math.round(d / 60e3)) + ' min left';
  if (d < DAY) return Math.round(d / 3600e3) + ' h left';
  return Math.round(d / DAY) + ' days left';
}
const fmtDur = s => { s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- toast ---------- */
function toast(msg, action, ms = 3200) {
  const w = $('#toasts');
  const t = h('div', { class: 'toast', role: 'status' }, msg);
  if (action) t.append(h('button', { onclick: () => { action.fn(); t.remove(); } }, action.label));
  w.append(t); setTimeout(() => t.remove(), ms);
}

/* ---------- storage (IndexedDB, with in-memory fallback) ---------- */
const DB = {
  db: null, mem: null,
  async open() {
    try {
      if (!window.indexedDB) throw new Error('no idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('margin-notebook', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('notes', { keyPath: 'id' });
          d.createObjectStore('blobs', { keyPath: 'id' });
          const v = d.createObjectStore('versions', { keyPath: 'id' });
          v.createIndex('noteId', 'noteId');
          d.createObjectStore('kv', { keyPath: 'k' });
        };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      try { navigator.storage?.persist?.(); } catch (e) {}
      return true;
    } catch (e) {
      this.mem = { notes: new Map(), blobs: new Map(), versions: new Map(), kv: new Map() };
      return false;
    }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const st = tx.objectStore(store);
      let out; const r = fn(st);
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async all(store) { if (this.mem) return [...this.mem[store].values()]; return this._tx(store, 'readonly', s => s.getAll()); },
  async get(store, key) { if (this.mem) return this.mem[store].get(key); return this._tx(store, 'readonly', s => s.get(key)); },
  async put(store, val) { if (this.mem) { this.mem[store].set(val.id ?? val.k, val); return; } return this._tx(store, 'readwrite', s => s.put(val)); },
  async del(store, key) { if (this.mem) { this.mem[store].delete(key); return; } return this._tx(store, 'readwrite', s => s.delete(key)); },
  async byIndex(store, idx, key) {
    if (this.mem) return [...this.mem[store].values()].filter(v => v[idx] === key);
    return this._tx(store, 'readonly', s => s.index(idx).getAll(key));
  },
  async clear(store) { if (this.mem) { this.mem[store].clear(); return; } return this._tx(store, 'readwrite', s => s.clear()); },
};

/* blobs: PDFs, images, audio */
const Blobs = {
  urls: new Map(),
  async put(blob, name = '') { const id = uid('b_'); await DB.put('blobs', { id, blob, type: blob.type, name, size: blob.size, created: Date.now() }); return id; },
  async get(id) { const r = await DB.get('blobs', id); return r ? r.blob : null; },
  async url(id) {
    if (this.urls.has(id)) return this.urls.get(id);
    const b = await this.get(id); if (!b) return '';
    const u = URL.createObjectURL(b); this.urls.set(id, u); return u;
  },
};

/* ---------- model ---------- */
const S = {
  notes: new Map(), notebooks: [], tool: { kind: 'type', color: 'ink', width: 2, hlColor: 'hlY' },
  tabs: [], active: null, view: 'home', scope: { kind: 'all' }, sort: 'updated', listQuery: '',
  hist: [], histPos: -1, penSeen: false, inspOpen: false, inspTab: 'links', persistent: true,
};
const Ev = { l: {}, on(e, f) { (this.l[e] ||= []).push(f); }, emit(e, ...a) { (this.l[e] || []).forEach(f => f(...a)); } };

function newNote(type, props = {}) {
  const now = Date.now();
  const n = {
    id: uid('n_'), type, title: '', notebookId: props.notebookId ?? Prefs.get('defaultNb', 'nb_inbox'), tags: [], pinned: false,
    created: now, updated: now, opened: now, expires: null, trashed: null, links: [], text: '',
  };
  if (type === 'page') Object.assign(n, { body: '', ink: [], paper: 'plain' });
  if (type === 'canvas') Object.assign(n, { strokes: [], items: [], view: { x: 0, y: 0, z: 1 } });
  if (type === 'research') Object.assign(n, { src: { url: '', author: '', site: '', published: '', accessed: new Date().toISOString().slice(0, 10) }, clips: [], body: '' });
  if (type === 'pdf') Object.assign(n, { blobId: null, pages: 0, pageText: [], annots: {}, lastPage: 1, thumb: '', fileName: '' });
  for (const k in props) if (props[k] !== undefined) n[k] = props[k];
  if (!n.notebookId || !nbById(n.notebookId)) n.notebookId = nbById('nb_inbox') ? 'nb_inbox' : (S.notebooks[0]?.id || 'nb_inbox');
  return n;
}

/* plain text for search + previews */
function htmlToText(html) {
  if (!html) return '';
  const d = document.createElement('div'); d.innerHTML = html;
  $$('.blk', d).forEach(b => b.replaceWith(b.dataset.kind === 'audio' ? ' [audio] ' : ' [sketch] '));
  $$('p,h1,h2,h3,li,blockquote,pre,div,br', d).forEach(e => e.append('\n'));
  return d.textContent.replace(/\n{3,}/g, '\n\n').trim();
}
function linksIn(html) {
  if (!html) return [];
  const out = new Set(); const re = /data-id="(n_[a-z0-9]+)"/g; let m;
  while ((m = re.exec(html))) out.add(m[1]);
  return [...out];
}
function computeDerived(n) {
  let text = '', links = [];
  if (n.type === 'page') { text = htmlToText(n.body); links = linksIn(n.body); }
  else if (n.type === 'canvas') { text = n.items.filter(i => i.kind === 'text').map(i => htmlToText(i.html)).join('\n'); links = n.items.flatMap(i => linksIn(i.html || '')); }
  else if (n.type === 'research') {
    const s = n.src || {};
    text = [s.url, s.author, s.site, ...n.clips.map(c => [c.text, c.title, c.url, c.note, c.caption, c.source].filter(Boolean).join(' ')), htmlToText(n.body)].filter(Boolean).join('\n');
    links = [...linksIn(n.body), ...n.clips.filter(c => c.noteId).map(c => c.noteId)];
  }
  else if (n.type === 'pdf') {
    const notes = Object.values(n.annots || {}).flatMap(a => (a.notes || []).map(c => c.text));
    text = notes.join('\n');
  }
  n.text = text; n.links = [...new Set(links)].filter(id => id !== n.id);
}
function noteTitle(n) { return n?.title?.trim() || (n?.type === 'pdf' ? n.fileName : '') || 'Untitled'; }
function snippet(n, len = 140) {
  if (n.type === 'pdf') return (n.pageText?.[0] || '').slice(0, len) || `${n.pages || 0} pages`;
  const t = (n.text || '').replace(/\s+/g, ' ').trim();
  if (t) return t.slice(0, len);
  if (n.type === 'canvas') return `${n.strokes.length} strokes · ${n.items.length} cards`;
  return '';
}
const liveNotes = () => [...S.notes.values()].filter(n => !n.trashed);
function nbById(id) { return S.notebooks.find(b => b.id === id); }
function nbPath(id) { const b = nbById(id); if (!b) return 'No notebook'; const p = b.parentId && nbById(b.parentId); return p ? p.name + ' / ' + b.name : b.name; }

const Store = {
  pending: new Map(),
  async load() {
    const ok = await DB.open(); S.persistent = ok;
    const [notes, kv] = await Promise.all([DB.all('notes'), DB.all('kv')]);
    notes.forEach(n => S.notes.set(n.id, n));
    const meta = Object.fromEntries(kv.map(r => [r.k, r.v]));
    S.notebooks = meta.notebooks || [];
    if (!meta.seeded) await seed();
    await this.sweep();
  },
  async saveNotebooks() { await DB.put('kv', { k: 'notebooks', v: S.notebooks }); Ev.emit('nav'); },
  touch(n, opts = {}) {
    if (!opts.silent) n.updated = Date.now();
    computeDerived(n);
    S.notes.set(n.id, n);
    clearTimeout(this.pending.get(n.id));
    this.pending.set(n.id, setTimeout(() => this.flush(n.id), opts.now ? 0 : 450));
    Ev.emit('saving', n);
    if (!opts.quiet) Ev.emit('changed', n);
  },
  async flush(id) {
    clearTimeout(this.pending.get(id)); this.pending.delete(id);
    const n = S.notes.get(id); if (!n) return;
    try { await DB.put('notes', n); Ev.emit('saved', n); Versions.maybe(n); }
    catch (e) { toast('Could not save “' + noteTitle(n) + '”. Storage may be full — try a backup and empty the trash.'); }
  },
  async flushAll() { await Promise.all([...this.pending.keys()].map(id => this.flush(id))); },
  async create(type, props, opts = {}) {
    const n = newNote(type, props); computeDerived(n); S.notes.set(n.id, n);
    await DB.put('notes', n); Ev.emit('changed', n); Ev.emit('nav');
    if (opts.open !== false) App.open(n.id, { focusTitle: !props?.title });
    return n;
  },
  async trash(id) {
    const n = S.notes.get(id); if (!n) return;
    n.trashed = Date.now(); await DB.put('notes', n); App.closeTab(id); Ev.emit('changed', n); Ev.emit('nav');
    toast('Moved to Trash', { label: 'Undo', fn: () => this.restore(id) });
  },
  async restore(id) { const n = S.notes.get(id); if (!n) return; n.trashed = null; n.expires = n.expires && n.expires < Date.now() ? null : n.expires; await DB.put('notes', n); Ev.emit('changed', n); Ev.emit('nav'); },
  async purge(id) {
    const n = S.notes.get(id); if (!n) return;
    S.notes.delete(id); await DB.del('notes', id);
    const vs = await DB.byIndex('versions', 'noteId', id); for (const v of vs) await DB.del('versions', v.id);
    for (const b of blobRefs(n)) if (!isBlobUsedElsewhere(b, id)) await DB.del('blobs', b);
    Ev.emit('changed', n); Ev.emit('nav');
  },
  async sweep() {
    const now = Date.now(); let moved = 0;
    for (const n of S.notes.values()) {
      if (!n.trashed && n.expires && n.expires < now) { n.trashed = now; n.expiredOut = true; await DB.put('notes', n); moved++; }
      if (n.trashed && now - n.trashed > 30 * DAY) await this.purge(n.id);
    }
    if (moved) setTimeout(() => toast(`${moved} scratch note${moved > 1 ? 's' : ''} expired and moved to Trash`), 800);
  },
};

class RichText {

    el.innerHTML = o.value || ''; this.hydrate();
    el.addEventListener('keydown', e => this.onKey(e));
    el.addEventListener('input', () => { this.trigger(); this.changed(); });
    el.addEventListener('click', e => this.onClick(e));
    el.addEventListener('paste', e => this.onPaste(e));

  }
  destroy() { this.layers.forEach(l => l.destroy()); this.layers = []; }
  changed() { this.o.onChange?.(); }
  value() {
    const c = this.el.cloneNode(true);
    $$('.blk', c).forEach(b => { b.innerHTML = ''; });
    $$('img[data-blob]', c).forEach(i => i.removeAttribute('src'));
    $$('[data-ph]', c).forEach(x => { if (x !== c) x.removeAttribute('data-ph'); });
    return c.innerHTML.replace(/^(<p><br><\/p>)+$/, '');
  }
  /* --- blocks --- */
  hydrate(root = this.el) {
    $$('.blk', root).forEach(b => this.hydrateBlock(b));
    $$('img[data-blob]', root).forEach(async i => { i.src = await Blobs.url(i.dataset.blob); });
    $$('a.wl', root).forEach(a => { const n = S.notes.get(a.dataset.id); a.classList.toggle('missing', !n || !!n.trashed); if (n) a.textContent = noteTitle(n); a.contentEditable = 'false'; });
  }
  hydrateBlock(b) {

    if (b.dataset.kind === 'ink') {
      let strokes = []; try { strokes = JSON.parse(b.dataset.ink || '[]'); } catch (e) {}
      const cv = h('canvas', { style: { height: (b.dataset.h || 220) + 'px' } });
      const L = new InkLayer({
        canvas: cv, target: cv, ctx: 'block', get: () => strokes,
        set: (a, live) => { strokes = a; if (!live) { b.dataset.ink = JSON.stringify(a); this.changed(); } else L.render(); },
        xf: () => { const s = cv.clientWidth / 700 || 1; return { s, ox: 0, oy: 0 }; },
        onCommit: () => { b.dataset.ink = JSON.stringify(strokes); this.changed(); },
      });

        const mv = ev => { const nh = clamp(h0 + ev.clientY - y0, 90, 1600); cv.style.height = nh + 'px'; };
        const up = () => { rs.removeEventListener('pointermove', mv); rs.removeEventListener('pointerup', up); b.dataset.h = Math.round(cv.clientHeight / (cv.clientWidth / 700)); this.changed(); };
        rs.addEventListener('pointermove', mv); rs.addEventListener('pointerup', up);
      });
      b.append(h('div', { class: 'blk-head' }, icon('sketch', 'sm'), h('span', { class: 'grow' }, 'Handwriting'), undo, del), cv, rs);
      requestAnimationFrame(() => { const s = cv.clientWidth / 700; if (s) cv.style.height = (b.dataset.h || 220) * s + 'px'; L.resize(); });
    } else if (b.dataset.kind === 'audio') {
      const au = h('audio', { controls: true, preload: 'metadata' });
      Blobs.url(b.dataset.blob).then(u => { au.src = u; });
      b.append(h('div', { class: 'audio-blk' }, h('span', { class: 'icon-btn on', style: { cursor: 'default' } }, icon('mic')), h('span', { class: 'aname', title: b.dataset.name }, b.dataset.name || 'Audio'), b.dataset.dur ? h('span', { class: 'mono muted' }, fmtDur(b.dataset.dur)) : null, au, del));
    }
  }
  topBlock(node) { let n = node; while (n && n.parentNode !== this.el) n = n.parentNode; return n && n.parentNode === this.el ? n : null; }
  insertBlock(el) {
    const sel = getSelection(); let anchor = null;
    if (sel.rangeCount && this.el.contains(sel.anchorNode)) anchor = this.topBlock(sel.anchorNode);
    const after = h('p', {}, h('br'));
    if (anchor) {
      const empty = anchor.nodeType === 1 && !anchor.textContent.trim() && !$('.blk,img', anchor) && anchor.tagName !== 'HR';
      if (empty) anchor.replaceWith(el); else anchor.after(el);
    } else this.el.append(el);

  }
  addSketch() { this.insertBlock(h('div', { class: 'blk ink-blk', dataset: { kind: 'ink', h: '240', ink: '[]' } })); if (!INK_TOOLS.has(S.tool.kind)) { S.tool.kind = S.lastInk || 'pen'; Ev.emit('tool'); } }
  async addImageFile(f) { const id = await Blobs.put(f, f.name); const img = h('img', { 'data-blob': id, alt: f.name || 'Image' }); this.insertBlock(img); }
  async addAudio(blob, name, dur) { const id = await Blobs.put(blob, name); this.insertBlock(h('div', { class: 'blk', dataset: { kind: 'audio', blob: id, name, dur: dur ? String(Math.round(dur)) : '' } })); }
  pickFile(accept, fn) { const i = h('input', { type: 'file', accept, multiple: true }); i.onchange = () => [...i.files].forEach(fn); i.click(); }
  /* --- commands --- */
  cmd(k) {

    switch (k) {

      case 'p': ex('formatBlock', 'p'); break;
      case 'ul': ex('insertUnorderedList'); break;
      case 'ol': ex('insertOrderedList'); break;
      case 'todo': { const inUl = this.closest('ul'); if (!inUl) ex('insertUnorderedList'); const ul = this.closest('ul'); if (ul) ul.classList.toggle('todo', inUl ? !ul.classList.contains('todo') : true); break; }
      case 'quote': ex('formatBlock', this.blockTag() === 'BLOCKQUOTE' ? 'p' : 'blockquote'); break;
      case 'code': ex('formatBlock', this.blockTag() === 'PRE' ? 'p' : 'pre'); break;
      case 'hr': this.insertBlock(h('hr')); break;
      case 'bold': ex('bold'); break; case 'italic': ex('italic'); break;
      case 'mark': this.mark(); break;
      case 'sketch': this.addSketch(); break;
      case 'image': this.pickFile('image/*', f => this.addImageFile(f)); break;
      case 'audiofile': this.pickFile('audio/*', f => this.addAudio(f, f.name)); break;
      case 'rec': Recorder.start(this); break;
      case 'link': ex('insertText', '[['); this.trigger(); break;
      case 'date': ex('insertText', new Date().toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })); break;
    }
    this.changed();
  }
  mark() {
    const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return;
    const m = this.closest('mark'); if (m) { m.replaceWith(...m.childNodes); return; }
    const r = sel.getRangeAt(0); const mk = document.createElement('mark');
    try { mk.append(r.extractContents()); r.insertNode(mk); } catch (e) {}
  }
  closest(sel) { const s = getSelection(); let n = s.anchorNode; if (n?.nodeType === 3) n = n.parentNode; const c = n?.closest?.(sel); return c && this.el.contains(c) ? c : null; }
  blockTag() { const s = getSelection(); const b = this.topBlock(s.anchorNode); return b?.tagName || ''; }
  /* --- keyboard --- */
  onKey(e) {
    if (Pop.open && Pop.rich === this && Pop.key(e)) { e.preventDefault(); return; }
    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.shiftKey && e.code === 'KeyH') { e.preventDefault(); this.mark(); this.changed(); return; }
    if (mod && e.altKey && /^Digit[123]$/.test(e.code)) { e.preventDefault(); this.cmd('h' + e.code.slice(-1)); return; }
    if (mod && e.key === 'Enter') { const li = this.closest('ul.todo li'); if (li) { e.preventDefault(); li.toggleAttribute('data-done'); this.changed(); } return; }
    if (e.key === 'Tab' && this.closest('li')) { e.preventDefault(); document.execCommand(e.shiftKey ? 'outdent' : 'indent'); return; }
    if (e.key === ' ' && !mod) {

        const start = sel.anchorOffset - urlM[1].length; const r = document.createRange(); r.setStart(node, start); r.setEnd(node, sel.anchorOffset);
        const a = h('a', { href: urlM[1], target: '_blank', rel: 'noopener' }, urlM[1]); r.deleteContents(); r.insertNode(a);
        r.setStartAfter(a); r.collapse(true); sel.removeAllRanges(); sel.addRange(r); return;
      }
      const atStart = blk && (blk === node || blk.firstChild === node || (blk.tagName === 'LI' || blk.firstChild?.firstChild === node)) && node.textContent.indexOf(before) === 0;
      const li = node.parentNode.closest?.('li'); const firstInLi = li && li.firstChild === node;
      if (!atStart && !firstInLi) return;
      const map = { '#': 'h1', '##': 'h2', '###': 'h3', '-': 'ul', '*': 'ul', '1.': 'ol', '[]': 'todo', '[ ]': 'todo', '>': 'quote', '```': 'code' };
      const k = map[before]; if (!k) return;
      e.preventDefault();
      node.textContent = node.textContent.slice(before.length);
      const r = document.createRange(); r.setStart(node, 0); r.collapse(true); sel.removeAllRanges(); sel.addRange(r);
      if (k === 'todo' && li) { li.parentNode.classList.add('todo'); this.changed(); return; }

    }
    if (e.key === 'Enter' && !e.shiftKey) {
      const sel = getSelection(); const blk = this.topBlock(sel.anchorNode);
      if (blk && blk.textContent === '---') { e.preventDefault(); const hr = h('hr'); const p = h('p', {}, h('br')); blk.replaceWith(hr); hr.after(p); const r = document.createRange(); r.setStart(p, 0); sel.removeAllRanges(); sel.addRange(r); this.changed(); return; }
      if (blk && (blk.tagName === 'PRE' || blk.tagName === 'BLOCKQUOTE') && blk.textContent.endsWith('\n\n')) { /* let browser handle */ }
    }
  }
  onClick(e) {
    const wl = e.target.closest('a.wl');
    if (wl) { e.preventDefault(); const n = S.notes.get(wl.dataset.id); if (n && !n.trashed) App.open(n.id, { newTab: e.metaKey || e.ctrlKey || e.shiftKey }); else toast('That note is in the Trash or was deleted.'); return; }
    const a = e.target.closest('a[href]');
    if (a && (e.metaKey || e.ctrlKey)) { window.open(a.href, '_blank', 'noopener'); return; }
    const li = e.target.closest('ul.todo > li');

  }
  onPaste(e) {

  }
  /* --- [[ and / triggers --- */
  trigger() {
    const sel = getSelection(); if (!sel.isCollapsed || !sel.anchorNode || sel.anchorNode.nodeType !== 3) { if (Pop.rich === this) Pop.hide(); return; }
    const node = sel.anchorNode, off = sel.anchorOffset, before = node.textContent.slice(0, off);
    const caret = () => { const r = sel.getRangeAt(0).cloneRange(); const rc = r.getClientRects()[0] || node.parentNode.getBoundingClientRect(); return rc; };
    const wm = before.match(/\[\[([^\]\n]{0,80})$/);
    if (wm) {
      const q = wm[1].trim().toLowerCase(), start = off - wm[0].length;
      const cands = liveNotes().filter(n => n.id !== this.o.noteId && (!q || noteTitle(n).toLowerCase().includes(q)))
        .sort((a, b) => (noteTitle(b).toLowerCase().startsWith(q) - noteTitle(a).toLowerCase().startsWith(q)) || b.updated - a.updated).slice(0, 8)
        .map(n => ({ label: noteTitle(n), icon: TYPE_ICON[n.type], hint: nbPath(n.notebookId), id: n.id }));
      if (wm[1].trim()) cands.push({ label: `Create “${wm[1].trim()}”`, icon: 'plus', create: wm[1].trim() });
      Pop.rich = this;
      Pop.show(cands, caret(), async it => {
        Pop.rich = null;
        let id = it.id;
        if (it.create) { const nn = await Store.create('page', { title: it.create, notebookId: S.notes.get(this.o.noteId)?.notebookId }, { open: false }); id = nn.id; toast(`Created “${it.create}”`); }
        const r = document.createRange(); r.setStart(node, start); r.setEnd(node, Math.min(off, node.textContent.length)); r.deleteContents();
        sel.removeAllRanges(); sel.addRange(r);
        const a = h('a', { class: 'wl', 'data-id': id, contenteditable: 'false' }, noteTitle(S.notes.get(id)));
        this.insertInline(a);
      });
      return;
    }
    const sm = before.match(/(?:^|\s)\/([a-z ]{0,20})$/i);
    const blk = node.parentElement?.closest('li,p,h1,h2,h3,blockquote,pre,div');
    if (sm && blk && this.el.contains(blk) && blk.textContent.replace(/\u00a0/g, ' ').trim() === before.replace(/\u00a0/g, ' ').trim()) {
      const q = sm[1].toLowerCase(), start = off - sm[1].length - 1;
      const items = SLASH.filter(c => (c.label + ' ' + c.k + ' ' + (c.kw || '')).toLowerCase().includes(q));
      if (!items.length) { Pop.hide(); return; }
      Pop.rich = this;
      Pop.show(items, caret(), it => {
        Pop.rich = null;
        const r = document.createRange(); r.setStart(node, start); r.setEnd(node, Math.min(off, node.textContent.length)); r.deleteContents(); sel.removeAllRanges(); sel.addRange(r);
        this.cmd(it.k);
      });
      return;
    }
    if (Pop.rich === this) { Pop.hide(); Pop.rich = null; }
  }
}

/* ---------- audio recording ---------- */
const Recorder = {
  rec: null, pill: null,
  async start(rt) {
    if (this.rec) return this.stop();
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return this.fallback(rt, 'Recording isn’t supported in this browser.');
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (e) { return this.fallback(rt, 'The microphone isn’t available here.'); }
    const chunks = []; const mr = new MediaRecorder(stream); const t0 = Date.now();
    mr.ondataavailable = e => e.data.size && chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(this.tick); this.pill?.remove(); this.pill = null; this.rec = null;
      const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
      const name = 'Recording · ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      await rt.addAudio(blob, name, (Date.now() - t0) / 1000); toast('Recording added to the note');
    };
    mr.start(1000); this.rec = mr;
    const tm = h('span', { class: 'mono' }, '0:00');
    this.pill = h('div', { class: 'rec-pill', role: 'status' }, h('i'), 'Recording', tm, h('button', { onclick: () => this.stop() }, 'Stop'));
    document.body.append(this.pill);
    this.tick = setInterval(() => { tm.textContent = fmtDur((Date.now() - t0) / 1000); }, 500);
  },
  stop() { this.rec?.state !== 'inactive' && this.rec?.stop(); },
  fallback(rt, why) {
    toast(why + ' You can attach a recording instead.', { label: 'Choose audio file', fn: () => rt.pickFile('audio/*', f => rt.addAudio(f, f.name)) }, 8000);
  },
};

function noteHeader(n, opts = {}) {
  const wrap = h('div', { class: 'note-head' });
  const title = h('input', { class: 'title-in', id: 'title-' + n.id, placeholder: opts.ph || 'Untitled', value: n.title || '', 'aria-label': 'Note title', autocomplete: 'off' });
  title.addEventListener('input', () => { n.title = title.value; Store.touch(n); });
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); opts.onEnter?.(); } });
  const meta = h('div', { class: 'meta-row' });
  const paint = () => {
    meta.innerHTML = '';
    const nb = nbById(n.notebookId);
    meta.append(h('span', { class: 'chip', title: 'Move to notebook', role: 'button', tabindex: 0, onclick: e => notebookMenu(e.currentTarget, id => { n.notebookId = id; Store.touch(n); Ev.emit('nav'); paint(); }) },
      h('span', { class: 'nb-dot', style: { background: nb?.color || 'var(--faint)' } }), nbPath(n.notebookId)));
    if (n.expires) meta.append(h('span', { class: 'chip warn', role: 'button', tabindex: 0, title: 'Scratch note — change expiry', onclick: e => expiryMenu(e.currentTarget, n, paint) }, icon('scratch', 'sm'), 'Scratch · ' + untilText(n.expires)));
    for (const t of n.tags) meta.append(h('span', { class: 'chip' }, '#' + t, h('button', { 'aria-label': 'Remove tag ' + t, title: 'Remove tag', onclick: () => { n.tags = n.tags.filter(x => x !== t); Store.touch(n); Ev.emit('nav'); paint(); } }, icon('x', 'sm'))));
    const ti = h('input', { class: 'tag-add', placeholder: '+ tag', list: 'tag-list', 'aria-label': 'Add tag' });
    ti.addEventListener('keydown', e => {
      if ((e.key === 'Enter' || e.key === ',') && ti.value.trim()) {
        e.preventDefault(); const t = ti.value.trim().replace(/^#/, '').toLowerCase().replace(/\s+/g, '-');
        if (!n.tags.includes(t)) { n.tags.push(t); Store.touch(n); Ev.emit('nav'); }
        paint(); $('.tag-add', meta)?.focus();
      }
    });
    meta.append(ti);
    if (n.pinned) meta.append(h('span', { class: 'chip accent' }, icon('pinFill', 'sm'), 'Pinned'));
    meta.append(h('span', { class: 'mono', style: { marginLeft: 'auto', color: 'var(--faint)' }, title: 'Created ' + fullTime(n.created) }, 'Edited ' + relTime(n.updated)));
  };
  paint();
  wrap.append(title, meta);
  wrap.repaint = paint; wrap.titleEl = title;
  return wrap;
}

async function exportAnnotatedPdf(n) {

      const words = safe(c.text).split(/\s+/), lines = []; let cur = '';
      for (const w of words) { if (font.widthOfTextAtSize((cur + ' ' + w).trim(), 8) > 150) { lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); }
      if (cur) lines.push(cur);
      const bw = 162, bh = 14 + lines.length * 10; const x = clamp(c.x + 8, 4, page.getWidth() - bw - 4), y = clamp(H - c.y - bh - 8, 4, H - bh - 4);

      page.drawText(`${i + 1}`, { x: x + 4, y: y + bh - 10, size: 7, font, color: rgb(.45, .37, .05) });
      lines.forEach((l, j) => page.drawText(l, { x: x + 14, y: y + bh - 10 - j * 10, size: 8, font, color: rgb(.15, .15, .15) }));

/* ---------- keyboard ---------- */
function bindKeys() {

    if (mod && !e.shiftKey && (code === 'KeyK' || code === 'KeyO')) { e.preventDefault(); Palette.el ? Palette.close() : Palette.open(); return; }
    if (mod && code === 'KeyS') { e.preventDefault(); const n = S.notes.get(S.active); if (n && S.view === 'note') { Store.flush(n.id); Versions.add(n, 'Saved manually').then(() => toast('Version saved')); } return; }
    if (e.altKey && !mod) {
      const go = f => { e.preventDefault(); f(); };
      if (code === 'KeyC') return go(() => Capture.open());
      if (code === 'KeyN') return go(() => Store.create('page', {}));
      if (code === 'KeyS') return go(() => App.newScratch());
      if (code === 'KeyH') return go(() => App.showHome());
      if (code === 'KeyF') return go(() => App.showSearch());
      if (code === 'KeyW') return go(() => S.active && App.closeTab(S.active));
      if (code === 'KeyI') return go(() => App.toggleInsp(S.inspTab || 'links'));
      if (code === 'BracketLeft') return go(() => App.histGo(-1));
      if (code === 'BracketRight') return go(() => App.histGo(1));
      if (code === 'Backslash') return go(() => App.toggleFocus());
      if (/^Digit[1-9]$/.test(code)) return go(() => { const id = S.tabs[+code.slice(5) - 1]; id && App.open(id, { noHist: false }); });
    }
    if (Palette.el || Capture.el || $('.scrim')) return;
    if (mod && code === 'KeyZ' && !typing && App.ed) { e.preventDefault(); e.shiftKey ? App.ed.redo?.() : App.ed.undo?.(); return; }
    if (typing || mod || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); App.showSearch(); return; }
    if (e.key === '?') { e.preventDefault(); Shortcuts.open(); return; }
    if (S.view === 'note' && App.ed) {
      const t = App.ed instanceof CanvasEditor ? { KeyV: 'select', KeyH: 'hand', KeyP: 'pen', KeyI: 'hl', KeyE: 'eraser', KeyT: 'text' }

    }
  });
}

      o.push(['Markdown', () => saveFile(base + '.md', md(), md())], ['HTML', async () => saveFile(base + '.html', htmlDoc(noteTitle(n), `<h1>${esc(noteTitle(n))}</h1>${await bodyToExportHtml(n.body)}`))], ['Plain text', () => { const t = noteTitle(n) + '\n\n' + htmlToText(n.body); saveFile(base + '.txt', t, t); }]);
      if (n.ink?.length) o.push(['Handwriting PNG', async () => { const b = strokesBounds(n.ink); saveFile(base + ' – handwriting.png', await canvasToBlob(inkPng(n.ink, [0, 0, 780, b[3] + 40]))); }]);
    }
    if (n.type === 'canvas') o.push(['PNG image', async () => saveFile(base + '.png', await canvasToBlob(await canvasNoteImage(n)))], ['SVG', () => saveFile(base + '.svg', canvasSvg(n))], ['Markdown (text)', () => saveFile(base + '.md', md(), md())]);
    if (n.type === 'research') o.push(['Markdown', () => saveFile(base + '.md', md(), md())], ['HTML', async () => saveFile(base + '.html', await this.researchHtml(n))]);
    if (n.type === 'pdf') o.push(['Annotated PDF', async () => { toast('Preparing annotated PDF…'); try { saveFile(base + ' (annotated).pdf', await exportAnnotatedPdf(n)); } catch (e) { console.warn(e); toast('Couldn’t build the annotated PDF. Check your connection and try again.'); } }],
      ['Original PDF', async () => saveFile(n.fileName || base + '.pdf', await Blobs.get(n.blobId))], ['Comments (.md)', () => saveFile(base + ' – annotations.md', md(), md())]);
    o.push(['Note data (JSON)', () => { const j = JSON.stringify(Versions.strip(n), null, 1); saveFile(base + '.json', j, j); }]);
    return o;
  },
  markdown(n) {
    const head = `# ${noteTitle(n)}\n\n` + (n.tags.length ? n.tags.map(t => '#' + t).join(' ') + '\n\n' : '');
    if (n.type === 'page') return head + htmlToMd(n.body);
    if (n.type === 'canvas') return head + n.items.filter(i => i.kind === 'text').map(i => '- ' + htmlToText(i.html).replace(/\n+/g, ' ')).join('\n') + '\n';
    if (n.type === 'pdf') {
      let s = head + `Source file: ${n.fileName}\n\n`;
      for (const [p, a] of Object.entries(n.annots || {}).sort((x, y) => x[0] - y[0])) { const cs = (a.notes || []).filter(c => c.text.trim()); if (!cs.length && !a.strokes?.length) continue; s += `## Page ${p}\n\n`; if (a.strokes?.length) s += `_${a.strokes.length} ink marks_\n\n`; cs.forEach((c, i) => s += `${i + 1}. ${c.text.trim()}\n`); s += '\n'; }
      return s;
    }
    if (n.type === 'research') {
      let s = head; const c = citation(n); if (c) s += `**Source:** ${c}\n\n` + (n.src.accessed ? `Accessed ${n.src.accessed}\n\n` : '');
      if (n.clips.length) s += '## Collected\n\n';
      for (const k of n.clips) {
        if (k.kind === 'quote') s += `> ${(k.text || '').replace(/\n/g, '\n> ')}${k.source ? ` (${k.source})` : ''}\n\n${k.note ? k.note + '\n\n' : ''}`;
        if (k.kind === 'link') s += `- [${k.title || k.url}](${k.url})${k.note ? ' — ' + k.note : ''}\n\n`;
        if (k.kind === 'image') s += `![${k.caption || 'screenshot'}](screenshot)\n\n`;
        if (k.kind === 'pdf') { const p = S.notes.get(k.noteId); s += `- PDF: ${p ? noteTitle(p) : 'missing'}${k.page ? `, p. ${k.page}` : ''}${k.note ? ' — ' + k.note : ''}\n\n`; }
        if (k.kind === 'note') s += `${k.text}\n\n`;
      }
      if (n.body) s += '## My notes\n\n' + htmlToMd(n.body);
      return s;
    }
    return head;
  },
  async researchHtml(n) {
    let s = `<h1>${esc(noteTitle(n))}</h1>`; const c = citation(n); if (c) s += `<p class="meta">${esc(c)}</p>`;
    for (const k of n.clips) {
      if (k.kind === 'quote') s += `<blockquote>${esc(k.text)}${k.source ? ` <span class="meta">(${esc(k.source)})</span>` : ''}</blockquote>${k.note ? `<p>${esc(k.note)}</p>` : ''}`;
      if (k.kind === 'link') s += `<p><a href="${esc(k.url)}">${esc(k.title || k.url)}</a>${k.note ? ' — ' + esc(k.note) : ''}</p>`;
      if (k.kind === 'image') { const b = await Blobs.get(k.blobId); if (b) s += `<figure><img src="${await blobToDataURL(b)}" alt=""><figcaption class="meta">${esc(k.caption || '')}</figcaption></figure>`; }

      if (k.kind === 'note') s += `<p>${esc(k.text)}</p>`;
    }
    if (n.body) s += '<h2>My notes</h2>' + await bodyToExportHtml(n.body);
    return htmlDoc(noteTitle(n), s);
  },
  async backup() {
    toast('Preparing backup…');
    await Store.flushAll();
    const notes = [...S.notes.values()]; const ids = new Set(notes.flatMap(blobRefs)); const blobs = [];
    for (const id of ids) { const r = await DB.get('blobs', id); if (r) blobs.push({ id, type: r.type, name: r.name, data: await blobToDataURL(r.blob) }); }
    const data = JSON.stringify({ app: 'margin-notebook', format: 1, exported: new Date().toISOString(), notebooks: S.notebooks, notes, blobs });
    saveFile(`margin-backup-${new Date().toISOString().slice(0, 10)}.json`, new Blob([data], { type: 'application/json' }));
  },
  async restore(file) {
    let d; try { d = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t a Margin backup.'); return; }
    if (d.app !== 'margin-notebook' || !Array.isArray(d.notes)) { toast('That file isn’t a Margin backup.'); return; }
    if (!(await Ask.confirm('Restore backup?', `${d.notes.length} notes and ${d.blobs?.length || 0} files will be merged in. Notes that already exist here are replaced by the backup copy.`, 'Restore'))) return;
    for (const b of d.blobs || []) { const blob = await (await fetch(b.data)).blob(); await DB.put('blobs', { id: b.id, blob, type: b.type, name: b.name, size: blob.size, created: Date.now() }); }
    for (const n of d.notes) { S.notes.set(n.id, n); await DB.put('notes', n); }
    for (const b of d.notebooks || []) if (!nbById(b.id)) S.notebooks.push(b);
    await Store.saveNotebooks(); Ev.emit('changed', {}); App.renderList(); toast(`Restored ${d.notes.length} notes`);
  },
};

function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
function mkStroke(pts, c = 'ink', w = 2, t = 'pen') { const s = { t, c, w, p: pts.flatMap(([x, y, p]) => [+x.toFixed(1), +y.toFixed(1), p ?? .55]) }; s.b = strokeBBox(s); return s; }
function ellipseStroke(cx, cy, rx, ry, c, seed = 3) { const r = rnd(seed), pts = []; for (let a = -0.4; a < Math.PI * 2 + .5; a += .12) pts.push([cx + Math.cos(a) * rx * (1 + (r() - .5) * .05), cy + Math.sin(a) * ry * (1 + (r() - .5) * .05), .45 + Math.sin(a * 2) * .15]); return mkStroke(pts, c, 1.8); }
function arrowStrokes(x1, y1, x2, y2, c = 'ink', bend = 20) {
  const pts = []; for (let t = 0; t <= 1.001; t += .05) { const mx = (x1 + x2) / 2 - (y2 - y1) / Math.hypot(x2 - x1, y2 - y1) * bend, my = (y1 + y2) / 2 + (x2 - x1) / Math.hypot(x2 - x1, y2 - y1) * bend; pts.push([(1 - t) ** 2 * x1 + 2 * (1 - t) * t * mx + t * t * x2, (1 - t) ** 2 * y1 + 2 * (1 - t) * t * my + t * t * y2, .4 + t * .3]); }
  const [ax, ay] = pts[pts.length - 3], ang = Math.atan2(y2 - ay, x2 - ax);
  return [mkStroke(pts, c, 1.8), mkStroke([[x2 + Math.cos(ang + 2.6) * 14, y2 + Math.sin(ang + 2.6) * 14], [x2, y2], [x2 + Math.cos(ang - 2.6) * 14, y2 + Math.sin(ang - 2.6) * 14]], c, 1.8)];
}
function scribble(x, y, len, c = 'ink', seed = 7) { const r = rnd(seed), pts = []; for (let i = 0; i <= len; i += 2.2) { const k = i / 7; pts.push([x + i + Math.sin(k * 2.1) * 3, y - Math.abs(Math.sin(k)) * (6 + r() * 7) + (r() - .5) * 2, .4 + r() * .3]); } return mkStroke(pts, c, 1.4); }
function wordStrokes(x, y, words, c, seed) { let cx = x; return words.map((w, i) => { const s = scribble(cx, y, w * 9, c, seed + i); cx += w * 9 + 14; return s; }); }
